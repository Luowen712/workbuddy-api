# 定时多架构打包发布：ghcr.io + amd64 离线 tar.gz artifact。
# 仓库为多目录布局（gateway/ 与 gui/），构建上下文需分别指向各自子目录。
name: Build & Publish

on:
  schedule:
    # 每天北京时间 12:23 = UTC 04:23。
    # 不用整点：GitHub schedule 在整点高峰排队严重，错峰 23 分降低排队延迟与丢弃率。
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    tags: ['v*'] # 打 tag 也触发发布

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: gateway
            image_suffix: ''
          - component: gui
            image_suffix: '-gui'
    steps:
      - uses: actions/checkout@v4

      # 镜像构建时 config.json 由 config.example.json 提供，仓库内不含任何真实配置。
      - name: Create config.json for build
        run: cp config.example.json config.json
        working-directory: ${{ matrix.component }}

      # setup-qemu 必须在 setup-buildx 之前：buildx 多架构依赖 QEMU 跨平台模拟。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr 镜像名必须全小写：github.repository 可能含大写，需转小写。
      - name: Compute image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Build & push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # 额外导出 amd64 离线 tar.gz：NAS 拉不到 ghcr 时用 artifact 部署。
      - name: Export offline tarball (amd64)
        run: |
          docker buildx build --platform linux/amd64 \
            --file ${{ matrix.component }}/Dockerfile \
            --tag ${{ matrix.component }}:offline \
            --output type=docker,dest=${{ matrix.component }}-amd64.tar \
            ./${{ matrix.component }}
          gzip -f ${{ matrix.component }}-amd64.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-amd64
          path: ${{ matrix.component }}-amd64.tar.gz
          if-no-files-found: error
